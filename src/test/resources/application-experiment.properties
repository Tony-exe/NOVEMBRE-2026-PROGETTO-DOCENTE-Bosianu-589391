# Profilo dell'esperimento sulle strategie di fetch (FetchStrategyExperimentTest).
# Stesso PostgreSQL locale, database di test ricreato a ogni esecuzione.
spring.datasource.url=jdbc:postgresql://localhost:5432/festival_test
spring.jpa.hibernate.ddl-auto=create-drop

# Statistiche di Hibernate: contano query preparate, entità caricate, ecc. (costano un po', quindi solo qui)
spring.jpa.properties.hibernate.generate_statistics=true

# Log delle query SQL, formattate, per poterle mostrare durante l'orale
logging.level.org.hibernate.SQL=DEBUG
spring.jpa.properties.hibernate.format_sql=true
# Riduco il resto del log per non coprire l'output dell'esperimento
logging.level.org.hibernate.stat=WARN
logging.level.org.springframework=WARN
