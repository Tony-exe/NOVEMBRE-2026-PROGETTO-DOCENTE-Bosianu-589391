spring.application.name=festival

# Profilo di default: dev (abilita DataInitializer e ddl-auto=update)
spring.profiles.default=dev

# PostgreSQL locale
spring.datasource.url=jdbc:postgresql://localhost:5432/festival
spring.datasource.username=postgres
spring.datasource.password=postgres

# Obbligatorio: niente sessione Hibernate aperta durante il rendering della vista.
# Ogni dato necessario va caricato nel service (dentro la transazione), altrimenti
# l'accesso a una associazione LAZY fuori dal service lancia LazyInitializationException.
spring.jpa.open-in-view=false

# Swagger UI: documenta solo le API REST e invia il token CSRF (letto dal cookie XSRF-TOKEN)
springdoc.paths-to-match=/api/**
springdoc.swagger-ui.csrf.enabled=true

#==================================
# = Messaggi (validazione e testi dei template, lezione 08)
#==================================
spring.messages.basename=messages/messages
spring.messages.encoding=UTF-8
# Se il browser chiede una lingua che non abbiamo, si usa messages.properties (italiano), non la lingua del server
spring.messages.fallback-to-system-locale=false

#==================================
# = Logging (SLF4J + Logback): il livello si cambia qui, senza toccare il codice
#==================================
logging.level.root=INFO
logging.level.it.uniroma3.siw=INFO
