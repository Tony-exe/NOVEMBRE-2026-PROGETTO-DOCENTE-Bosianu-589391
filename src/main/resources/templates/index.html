<!DOCTYPE html>
<html lang="it" xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Festival cinematografici</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
</head>
<body>
<!-- Pagina provvisoria: layout e navbar comuni arrivano nella fase 4 -->
<main class="container py-4">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h1 class="h3 m-0">Festival cinematografici</h1>
        <div>
            <span sec:authorize="isAuthenticated()">
                Ciao <strong sec:authentication="name"></strong>
                <span sec:authorize="hasRole('ADMIN')" class="badge text-bg-dark">admin</span>
                <!-- il logout è un POST (con token CSRF), non un semplice link -->
                <form th:action="@{/logout}" method="post" class="d-inline">
                    <button type="submit" class="btn btn-sm btn-outline-secondary ms-2">Esci</button>
                </form>
            </span>
            <span sec:authorize="isAnonymous()">
                <a th:href="@{/login}" class="btn btn-sm btn-primary">Accedi</a>
                <a th:href="@{/register}" class="btn btn-sm btn-outline-primary">Registrati</a>
            </span>
        </div>
    </div>

    <div th:if="${param.logout}" class="alert alert-info">Sei uscito.</div>

    <ul class="list-group">
        <li class="list-group-item" th:each="festival : ${festivals}">
            <strong th:text="${festival.nome}">Nome</strong>
            – <span th:text="${festival.citta}">Città</span>
            (<span th:text="${#temporals.format(festival.dataInizio, 'dd/MM/yyyy')}"></span>
            – <span th:text="${#temporals.format(festival.dataFine, 'dd/MM/yyyy')}"></span>)
        </li>
    </ul>
</main>
</body>
</html>
