<!DOCTYPE html>
<!--
  Frammenti comuni a tutte le pagine. Ogni pagina li include con th:replace, ad esempio:
    <head th:replace="~{fragments/layout :: head('Titolo')}"></head>
  Così header, navbar e footer sono scritti una volta sola. head(titolo) è un frammento parametrico.
  I testi fissi sono espressioni #{chiave}: il valore sta in messages/messages*.properties (una lingua per file).
-->
<html lang="it" xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">

<head th:fragment="head(titolo)">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="${titolo} + ' · Festival'">Festival</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <link rel="stylesheet" th:href="@{/css/app.css}">
</head>

<body>

<!-- Navbar: le voci cambiano in base al ruolo grazie a sec:authorize -->
<nav th:fragment="navbar" class="navbar navbar-expand-lg navbar-dark bg-dark mb-4">
    <div class="container">
        <a class="navbar-brand" th:href="@{/}">🎬 Festival</a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#menu"
                aria-controls="menu" aria-expanded="false" aria-label="Apri il menu">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="menu">
            <ul class="navbar-nav me-auto">
                <li class="nav-item"><a class="nav-link" th:href="@{/festivals}" th:text="#{navbar.festival}">Festival</a></li>
                <li class="nav-item dropdown" sec:authorize="hasRole('ADMIN')">
                    <a class="nav-link dropdown-toggle" href="#" role="button" data-bs-toggle="dropdown"
                       aria-expanded="false" th:text="#{navbar.gestione}">Gestione</a>
                    <ul class="dropdown-menu">
                        <li><a class="dropdown-item" th:href="@{/admin}">Pannello</a></li>
                        <li><hr class="dropdown-divider"></li>
                        <li><a class="dropdown-item" th:href="@{/admin/festivals}">Festival e proiezioni</a></li>
                        <li><a class="dropdown-item" th:href="@{/admin/films}">Film e cast</a></li>
                        <li><a class="dropdown-item" th:href="@{/admin/registi}">Registi</a></li>
                        <li><a class="dropdown-item" th:href="@{/admin/attori}">Attori</a></li>
                        <li><a class="dropdown-item" th:href="@{/admin/sale}">Sale</a></li>
                    </ul>
                </li>
            </ul>
            <!-- sec:authorize legge direttamente il SecurityContext: funziona anche nelle pagine di errore,
                 dove gli attributi @ModelAttribute dei @ControllerAdvice (es. userDetails) non ci sono -->
            <div class="d-flex align-items-center gap-2" sec:authorize="isAuthenticated()">
                <span class="navbar-text">
                    <span sec:authentication="name">utente</span>
                    <span sec:authorize="hasRole('ADMIN')" class="badge text-bg-warning ms-1">admin</span>
                </span>
                <!-- Il logout è un POST con token CSRF (aggiunto da th:action), non un link -->
                <form th:action="@{/logout}" method="post">
                    <button type="submit" class="btn btn-sm btn-outline-light" th:text="#{navbar.esci}">Esci</button>
                </form>
            </div>
            <div class="d-flex gap-2" sec:authorize="isAnonymous()">
                <a class="btn btn-sm btn-outline-light" th:href="@{/login}" th:text="#{navbar.accedi}">Accedi</a>
                <a class="btn btn-sm btn-light" th:href="@{/register}" th:text="#{navbar.registrati}">Registrati</a>
            </div>
        </div>
    </div>
</nav>

<!-- Messaggi flash: impostati dai controller con RedirectAttributes.addFlashAttribute -->
<div th:fragment="flash">
    <div th:if="${successo}" class="alert alert-success alert-dismissible fade show" role="alert">
        <span th:text="${successo}">Operazione completata</span>
        <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Chiudi"></button>
    </div>
    <div th:if="${errore}" class="alert alert-danger alert-dismissible fade show" role="alert">
        <span th:text="${errore}">Errore</span>
        <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Chiudi"></button>
    </div>
</div>

<!--
  Campo di un form legato a th:object. Va incluso dentro un <form th:object="...">.
  __${nome}__ è una pre-elaborazione: il nome del campo viene sostituito prima di valutare *{...}.
-->
<div th:fragment="campo(nome, etichetta, tipo)" class="mb-3">
    <label th:for="${nome}" class="form-label" th:text="${etichetta}">Etichetta</label>
    <input th:type="${tipo}" th:field="*{__${nome}__}" class="form-control"
           th:classappend="${#fields.hasErrors(nome)} ? 'is-invalid'">
    <div class="invalid-feedback" th:errors="*{__${nome}__}">Errore</div>
</div>

<!-- Errori non legati a un campo (es. regole di business segnalate dal service) -->
<div th:fragment="erroriGlobali" th:if="${#fields.hasGlobalErrors()}" class="alert alert-danger">
    <div th:each="messaggio : ${#fields.globalErrors()}" th:text="${messaggio}">Errore</div>
</div>

<footer th:fragment="footer" class="container py-4 mt-5 border-top text-muted small">
    <span th:text="#{footer.testo}">Sistemi Informativi su Web · Roma Tre · Progetto festival cinematografici</span>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</footer>

</body>
</html>
