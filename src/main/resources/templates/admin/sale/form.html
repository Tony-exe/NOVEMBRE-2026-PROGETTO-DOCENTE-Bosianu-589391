<!DOCTYPE html>
<html lang="it" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head(${salaId} == null ? 'Nuova sala' : 'Modifica sala')}"></head>
<body>
<nav th:replace="~{fragments/layout :: navbar}"></nav>
<main class="container" style="max-width: 640px">
    <h1 class="h3 mb-4" th:text="${salaId} == null ? 'Nuova sala' : 'Modifica sala'">Sala</h1>

    <form th:action="${salaId} == null ? @{/admin/sale} : @{/admin/sale/{id}(id=${salaId})}"
          th:object="${form}" method="post" class="card card-body" novalidate>
        <div th:replace="~{fragments/layout :: campo('nome', 'Nome', 'text')}"></div>
        <div th:replace="~{fragments/layout :: campo('indirizzo', 'Indirizzo', 'text')}"></div>
        <div th:replace="~{fragments/layout :: campo('capienza', 'Capienza (posti)', 'number')}"></div>
        <div class="d-flex gap-2">
            <button type="submit" class="btn btn-primary">Salva</button>
            <a th:href="@{/admin/sale}" class="btn btn-outline-secondary">Annulla</a>
        </div>
    </form>
</main>
<footer th:replace="~{fragments/layout :: footer}"></footer>
</body>
</html>
