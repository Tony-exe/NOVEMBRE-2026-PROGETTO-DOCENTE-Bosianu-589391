<!DOCTYPE html>
<html lang="it" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Gestione film')}"></head>
<body>
<nav th:replace="~{fragments/layout :: navbar}"></nav>
<main class="container">
    <div th:replace="~{fragments/layout :: flash}"></div>
    <div class="d-flex justify-content-between align-items-center mb-3">
        <h1 class="h3 m-0">Film</h1>
        <a th:href="@{/admin/films/new}" class="btn btn-primary">Nuovo film</a>
    </div>

    <div class="table-responsive">
    <table class="table table-hover bg-white border">
        <thead class="table-light">
        <tr><th>Titolo</th><th>Regista</th><th>Anno</th><th>Genere</th><th>Durata</th><th class="text-end">Azioni</th></tr>
        </thead>
        <tbody>
        <tr th:each="film : ${films}">
            <td><a th:href="@{/app/movies/{id}(id=${film.id})}" th:text="${film.titolo}">Titolo</a></td>
            <td th:text="${film.regista.nome + ' ' + film.regista.cognome}">Regista</td>
            <td th:text="${film.anno}">Anno</td>
            <td th:text="${film.genere}">Genere</td>
            <td th:text="${film.durata} + ' min'">120 min</td>
            <td class="text-end azioni">
                <a th:href="@{/admin/films/{id}/edit(id=${film.id})}" class="btn btn-sm btn-outline-secondary">Modifica</a>
                <a th:href="@{/admin/films/{id}/cast(id=${film.id})}" class="btn btn-sm btn-outline-primary">Cast</a>
            </td>
        </tr>
        </tbody>
    </table>
    </div>
</main>
<footer th:replace="~{fragments/layout :: footer}"></footer>
</body>
</html>
