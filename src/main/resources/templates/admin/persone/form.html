<!DOCTYPE html>
<html lang="it" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head(${titolo})}"></head>
<body>
<nav th:replace="~{fragments/layout :: navbar}"></nav>
<main class="container" style="max-width: 640px">
    <h1 class="h3 mb-4" th:text="${titolo}">Persona</h1>

    <form th:action="${personaId} == null ? @{__${base}__} : @{__${base}__/{id}(id=${personaId})}"
          th:object="${form}" method="post" class="card card-body" novalidate>
        <div class="row">
            <div class="col-md-6" th:insert="~{fragments/layout :: campo('nome', 'Nome', 'text')}"></div>
            <div class="col-md-6" th:insert="~{fragments/layout :: campo('cognome', 'Cognome', 'text')}"></div>
        </div>
        <div class="row">
            <div class="col-md-6" th:insert="~{fragments/layout :: campo('dataNascita', 'Data di nascita', 'date')}"></div>
            <div class="col-md-6" th:insert="~{fragments/layout :: campo('nazionalita', 'Nazionalità', 'text')}"></div>
        </div>
        <div class="d-flex gap-2">
            <button type="submit" class="btn btn-primary">Salva</button>
            <a th:href="@{__${base}__}" class="btn btn-outline-secondary">Annulla</a>
        </div>
    </form>
</main>
<footer th:replace="~{fragments/layout :: footer}"></footer>
</body>
</html>
