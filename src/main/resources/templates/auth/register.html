<!DOCTYPE html>
<html lang="it" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Registrati – Festival</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
</head>
<body class="bg-light">
<main class="container py-5" style="max-width: 420px">
    <h1 class="h3 mb-4">Registrati</h1>

    <form th:action="@{/register}" th:object="${form}" method="post" class="card card-body" novalidate>
        <div class="mb-3">
            <label for="username" class="form-label">Username</label>
            <input type="text" id="username" th:field="*{username}" class="form-control"
                   th:classappend="${#fields.hasErrors('username')} ? 'is-invalid'">
            <div class="invalid-feedback" th:errors="*{username}"></div>
        </div>
        <div class="mb-3">
            <label for="password" class="form-label">Password</label>
            <input type="password" id="password" th:field="*{password}" class="form-control"
                   th:classappend="${#fields.hasErrors('password')} ? 'is-invalid'">
            <div class="invalid-feedback" th:errors="*{password}"></div>
        </div>
        <button type="submit" class="btn btn-primary w-100">Crea account</button>
    </form>

    <p class="mt-3">Hai già un account? <a th:href="@{/login}">Accedi</a></p>
</main>
</body>
</html>
