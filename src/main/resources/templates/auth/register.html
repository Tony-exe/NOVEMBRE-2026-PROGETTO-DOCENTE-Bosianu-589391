<!DOCTYPE html>
<html lang="it" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Registrati')}"></head>
<body>
<nav th:replace="~{fragments/layout :: navbar}"></nav>
<main class="container" style="max-width: 440px">
    <h1 class="h3 mb-4">Registrati</h1>

    <form th:action="@{/register}" th:object="${form}" method="post" class="card card-body" novalidate>
        <div th:replace="~{fragments/layout :: campo('username', 'Username', 'text')}"></div>
        <div th:replace="~{fragments/layout :: campo('password', 'Password', 'password')}"></div>
        <button type="submit" class="btn btn-primary w-100">Crea account</button>
    </form>

    <p class="mt-3">Hai già un account? <a th:href="@{/login}">Accedi</a></p>
</main>
<footer th:replace="~{fragments/layout :: footer}"></footer>
</body>
</html>
