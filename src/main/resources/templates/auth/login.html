<!DOCTYPE html>
<html lang="it" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Accedi – Festival</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
</head>
<body class="bg-light">
<main class="container py-5" style="max-width: 420px">
    <h1 class="h3 mb-4">Accedi</h1>

    <div th:if="${messaggio}" class="alert alert-success" th:text="${messaggio}"></div>
    <!-- Spring Security reindirizza a /login?error se le credenziali sono sbagliate -->
    <div th:if="${param.error}" class="alert alert-danger">Username o password non validi.</div>

    <!-- th:action aggiunge automaticamente il campo nascosto con il token CSRF -->
    <form th:action="@{/login}" method="post" class="card card-body">
        <div class="mb-3">
            <label for="username" class="form-label">Username</label>
            <input type="text" id="username" name="username" class="form-control" required autofocus>
        </div>
        <div class="mb-3">
            <label for="password" class="form-label">Password</label>
            <input type="password" id="password" name="password" class="form-control" required>
        </div>
        <button type="submit" class="btn btn-primary w-100">Accedi</button>
    </form>

    <p class="mt-3">Non hai un account? <a th:href="@{/register}">Registrati</a></p>
    <p><a th:href="@{/}">Torna alla home</a></p>
</main>
</body>
</html>
