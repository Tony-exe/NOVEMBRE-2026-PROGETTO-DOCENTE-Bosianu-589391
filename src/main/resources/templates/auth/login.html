<!DOCTYPE html>
<html lang="it" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Accedi')}"></head>
<body>
<nav th:replace="~{fragments/layout :: navbar}"></nav>
<main class="container" style="max-width: 440px">
    <h1 class="h3 mb-4">Accedi</h1>

    <div th:if="${messaggio}" class="alert alert-success" th:text="${messaggio}"></div>
    <!-- Spring Security reindirizza a /login?error se le credenziali sono sbagliate -->
    <div th:if="${param.error}" class="alert alert-danger">Username o password non validi.</div>

    <!-- th:action aggiunge automaticamente il campo nascosto con il token CSRF.
         Il POST /login è gestito dal filtro di Spring Security, non da un controller. -->
    <form th:action="@{/login}" method="post" class="card card-body">
        <div class="mb-3">
            <label for="username" class="form-label">Username</label>
            <input type="text" id="username" name="username" class="form-control" required autofocus>
        </div>
        <div class="mb-3">
            <label for="password" class="form-label">Password</label>
            <input type="password" id="password" name="password" class="form-control" required>
        </div>
        <button type="submit" class="btn btn-primary w-100">Accedi</button>
    </form>

    <p class="mt-3">Non hai un account? <a th:href="@{/register}">Registrati</a></p>
</main>
<footer th:replace="~{fragments/layout :: footer}"></footer>
</body>
</html>
