#==================================
# = Messaggi dell'applicazione (italiano, lingua di default)
#==================================
# Registrati in application.properties con spring.messages.basename=messages/messages.
# Chiavi dei messaggi di validazione (lezione 08), dalla piu' generale alla piu' specifica:
#   NotBlank                   -> tutti i campi con vincolo @NotBlank
#   NotBlank.testo             -> il campo "testo" di qualunque oggetto
#   NotBlank.form.testo        -> il campo "testo" dell'oggetto "form" del modello
# In caso di conflitto vince sempre la chiave piu' specifica.
# I messaggi di validazione ricevono argomenti ({0} = campo, poi gli attributi del vincolo in ordine
# alfabetico: per @Size {1} = max e {2} = min, per @Min/@Max {1} = value), quindi passano da
# MessageFormat: un apostrofo va scritto doppio (''), e {1,number,#} stampa un numero senza separatore
# delle migliaia (2000, non 2.000).

# --- Vincoli generici ---
NotBlank=Campo obbligatorio
NotNull=Campo obbligatorio
Size=Puoi inserire al massimo {1,number,#} caratteri
Min=Il valore minimo è {1,number,#}
Max=Il valore massimo è {1,number,#}
Past=La data deve essere nel passato
Pattern=Formato non valido

# --- Vincoli specifici di un campo ---
NotNull.registaId=Seleziona un regista
NotNull.attoreId=Seleziona un attore
NotNull.filmId=Seleziona un film
NotNull.salaId=Seleziona una sala
Size.testo=Il testo deve avere tra {2,number,#} e {1,number,#} caratteri
Size.username=Lo username deve avere tra {2,number,#} e {1,number,#} caratteri
Size.password=La password deve avere almeno {2,number,#} caratteri
Pattern.username=Usa solo lettere, numeri, punto e underscore
Min.voto=Il voto va da 1 a 5
Max.voto=Il voto va da 1 a 5
Min.capienza=La capienza deve essere maggiore di zero
Min.durata=La durata deve essere di almeno {1,number,#} minuto
Max.durata=La durata non può superare {1,number,#} minuti
Min.anno=L''anno deve essere successivo al {1,number,#}
Max.anno=L''anno deve essere precedente al {1,number,#}
Past.dataNascita=La data di nascita deve essere nel passato
# vincolo di classe @PeriodoValido, associato al campo dataFine
PeriodoValido=La data di fine non può precedere la data di inizio

# --- Errori di conversione (il valore inviato non e' del tipo atteso) ---
typeMismatch=Formato non valido
typeMismatch.java.lang.Integer=Deve essere un numero intero
typeMismatch.java.lang.Long=Selezione non valida
typeMismatch.java.time.LocalDate=Data non valida
typeMismatch.java.time.LocalTime=Orario non valido

# --- Testi delle pagine (espressioni #{...} nei template) ---
navbar.festival=Festival
navbar.gestione=Gestione
navbar.accedi=Accedi
navbar.registrati=Registrati
navbar.esci=Esci
footer.testo=Sistemi Informativi su Web \u00b7 Roma Tre \u00b7 Progetto festival cinematografici
login.errore=Username o password non validi.
errore.titolo=Errore
errore.testo=Si \u00e8 verificato un errore imprevisto.
errore.torna=Torna alla home
errore.403.titolo=Accesso negato
errore.403.testo=Non hai i permessi per accedere a questa pagina.
errore.404.titolo=Pagina non trovata
errore.404.testo=La pagina che cerchi non esiste.
errore.500.titolo=Errore interno
errore.500.testo=Si \u00e8 verificato un errore interno. Riprovare pi\u00f9 tardi.
